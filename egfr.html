<!doctype html><html lang="vi"><head><script src="bcct-fast-sync.js"></script><meta name="author" content="Trương Minh Quý"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tính eGFR CKD-EPI 2021</title><link rel="stylesheet" href="clinical-tool.css"><link rel="stylesheet" href="desktop-theme.css?v=20260921-394"><script src="desktop-theme.js?v=20260921-394" defer></script><link rel="stylesheet" href="win98-theme.css">
<link rel="stylesheet" href="bcct-runtime.css"><script defer src="bcct-runtime.js"></script></head><body><div class="wrap"><div class="head"><h1>🧪 eGFR</h1><p>CKD-EPI Creatinine 2021, không dùng hệ số chủng tộc</p></div><section class="panel"><div class="row"><div><label>Tuổi</label><input id="age" type="number" min="18" max="120"></div><div><label>Giới tính</label><select id="sex"><option value="male">Nam</option><option value="female">Nữ</option></select></div></div><div class="toggle"><button class="on" data-unit="umol">µmol/L</button><button data-unit="mg">mg/dL</button></div><label id="crLabel">Creatinin (µmol/L)</label><input id="cr" type="number" min="0" step="0.1"><button class="action" id="calc">Tính eGFR</button><div class="result" id="result"><strong>-- mL/phút/1,73m²</strong><small>Nhập tuổi và creatinin.</small></div><div class="info">Kết quả cần được diễn giải cùng bối cảnh lâm sàng, albumin niệu và các xét nghiệm liên quan.</div></section><footer class="owner">© 2026 <b>TRƯƠNG MINH QUÝ</b> • All rights reserved.</footer></div><script>
const $=id=>document.getElementById(id);let unit='umol';function hist(entry){try{parent.postMessage({type:'BCCT_HISTORY_ADD',entry},'*')}catch(e){}}document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{unit=b.dataset.unit;document.querySelectorAll('[data-unit]').forEach(x=>x.classList.toggle('on',x===b));$('crLabel').textContent=unit==='umol'?'Creatinin (µmol/L)':'Creatinin (mg/dL)';$('cr').value=''});$('calc').onclick=()=>{const age=Number($('age').value),sex=$('sex').value,raw=Number($('cr').value),r=$('result');if(!Number.isInteger(age)||!Number.isFinite(raw)||!(age>=18&&age<=120&&raw>0)){r.innerHTML='<strong>--</strong><small>Tuổi 18–120 và creatinin phải lớn hơn 0.</small>';return}const scr=unit==='umol'?raw/88.4:raw,k=sex==='female'?.7:.9,a=sex==='female'?-.241:-.302;const e=142*Math.pow(Math.min(scr/k,1),a)*Math.pow(Math.max(scr/k,1),-1.2)*Math.pow(.9938,age)*(sex==='female'?1.012:1);const stage=e>=90?'G1 (≥90)':e>=60?'G2 (60–89)':e>=45?'G3a (45–59)':e>=30?'G3b (30–44)':e>=15?'G4 (15–29)':'G5 (<15)';r.innerHTML=`<strong>${e.toFixed(0)} mL/phút/1,73m²</strong><small>Nhóm eGFR tham khảo: ${stage}.</small>`;hist({tool:'eGFR',title:'Tính eGFR CKD-EPI 2021',summary:`eGFR ${e.toFixed(0)} mL/phút/1,73m² • ${stage}`})};

(function(){function snapshot(){const out={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);out[k]=localStorage.getItem(k)}return out}addEventListener('message',function(e){const m=e.data;if(!m||m.type!=='BCCT_SYNC'||!m.requestId)return;try{if(m.action==='import'){localStorage.clear();for(const [k,v] of Object.entries(m.storage||{}))localStorage.setItem(k,String(v))}e.source.postMessage({type:'BCCT_SYNC_RESULT',requestId:m.requestId,ok:true,storage:snapshot()},'*')}catch(err){e.source.postMessage({type:'BCCT_SYNC_RESULT',requestId:m.requestId,ok:false,error:String(err&&err.message||err)},'*')}})})();
</script></body></html>
