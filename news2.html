:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#212d37;background:#f1f6f9}*{box-sizing:border-box}body{margin:0;padding:16px 14px calc(30px + env(safe-area-inset-bottom))}.wrap{max-width:720px;margin:auto}h1{text-align:center;color:#144368;margin:4px 0 8px}.sub{text-align:center;color:#657d89;margin:0 0 18px;font-size:13px}.card{background:#fff;border:1px solid #cfdee6;border-radius:16px;padding:15px;margin-bottom:12px}label.title{display:block;font-weight:800;color:#144368;margin-bottom:9px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}select{width:100%;min-height:54px;border:1px solid #aebfc8;border-radius:11px;padding:7px 12px;font-size:16px;background:#fff}.toggle{display:flex;align-items:center;gap:10px;padding:9px 0}.toggle input{width:22px;height:22px}.radios{display:flex;gap:10px}.radio{flex:1;border:1px solid #b6c8d1;border-radius:11px;padding:11px}.actions{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin:16px 0}button{border:0;border-radius:12px;height:52px;font-size:17px;font-weight:800}.primary{background:#19679f;color:#fff}.secondary{background:#dde9ef;color:#31576c}.result{display:none;border:2px solid;border-radius:16px;padding:17px;margin-top:12px}.score{font-size:28px;font-weight:900}.risk{font-weight:900;margin:8px 0}.response{line-height:1.48}.details{white-space:pre-line;margin-top:14px;border-top:1px solid #b9cbd4;padding-top:12px;line-height:1.55}.note{font-size:12px;color:#667e8b;line-height:1.4}.default{display:inline-block;background:#e8f4f8;color:#0d6485;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:700}@media(max-width:500px){.row{grid-template-columns:1fr}}.news-live{position:sticky;top:0;z-index:4;margin:0 0 10px;padding:10px 12px;border:2px solid var(--gold);border-radius:13px;background:var(--sea);color:#fff;font-weight:900;text-align:center}</style>
<style id="one-piece-mobile-theme">
:root{--sea:#0b3a67;--ocean:#0879a8;--red:#c51f2d;--gold:#f4c542;--paper:#fff8df}html,body{max-width:100%;overflow-x:hidden;background:linear-gradient(#dff4ff,#eef8fb)}body{padding:12px 9px calc(20px + env(safe-area-inset-bottom))}.wrap{width:100%}h1{font-size:23px;color:var(--sea);margin-top:2px}h1:before{content:"☠️ ";}.card{padding:13px;border:1.5px solid #d8c275;background:#fffdf6;border-radius:15px}label.title{color:var(--sea)}select{min-height:50px;border-color:#b5aa7d}.primary{background:linear-gradient(135deg,var(--red),#a91723);border:2px solid var(--gold)}.secondary{background:#e2f4fa;color:var(--sea);border:1px solid #8bbdd0}.actions{gap:8px}.default{background:#fff0bd;color:#705000}.result{background:#fffdf6}.tmq-owner-footer{margin:14px auto 0;max-width:720px;padding:9px;border-radius:12px;background:var(--sea);color:#fff;text-align:center;font-size:10.5px}.tmq-owner-footer b{color:#ffe57a}.tmq-owner-footer span{opacity:.8}@media(max-width:500px){.row{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}button{font-size:15px}.tmq-owner-footer span{display:none}}

<link rel="stylesheet" href="bcct-runtime.css"><script defer src="bcct-runtime.js"></script></head><body><div class="wrap"><h1>TÍNH ĐIỂM NEWS2</h1><p class="sub"><span class="default">Mặc định: nhịp thở 20 • nhiệt độ 37°C</span></p>
<div id="newsLive" class="news-live">Chọn các dấu hiệu rồi bấm Tính điểm</div><div class="card"><div class="row"><div><label class="title">Nhịp thở (lần/phút)</label><select id="rr"><option value="8" data-score="3">≤ 8 — 3 điểm</option><option value="10" data-score="1">9–11 — 1 điểm</option><option value="20" data-score="0" selected>12–20 (mặc định 20) — 0 điểm</option><option value="22" data-score="2">21–24 — 2 điểm</option><option value="25" data-score="3">≥ 25 — 3 điểm</option></select></div><div><label class="title">SpO₂</label><select id="spo2"></select></div></div></div>
<div class="card"><label class="title">Thang SpO₂</label><div class="radios"><label class="radio"><input type="radio" name="scale" value="1" checked> Thang 1</label><label class="radio"><input type="radio" name="scale" value="2"> Thang 2</label></div><label class="toggle"><input id="oxy" type="checkbox"> Đang thở oxy bổ sung</label><div class="note">Chỉ dùng thang 2 khi đã xác nhận suy hô hấp tăng CO₂ máu và mục tiêu SpO₂ 88–92%.</div></div>
<div class="card"><div class="row"><div><label class="title">Huyết áp tâm thu</label><select id="bp"><option value="90" data-score="3">≤ 90 mmHg — 3 điểm</option><option value="100" data-score="2">91–100 mmHg — 2 điểm</option><option value="110" data-score="1">101–110 mmHg — 1 điểm</option><option value="120" data-score="0" selected>111–219 mmHg — 0 điểm</option><option value="220" data-score="3">≥ 220 mmHg — 3 điểm</option></select></div><div><label class="title">Mạch</label><select id="pulse"><option value="40" data-score="3">≤ 40 lần/phút — 3 điểm</option><option value="50" data-score="1">41–50 — 1 điểm</option><option value="80" data-score="0" selected>51–90 — 0 điểm</option><option value="100" data-score="1">91–110 — 1 điểm</option><option value="120" data-score="2">111–130 — 2 điểm</option><option value="131" data-score="3">≥ 131 — 3 điểm</option></select></div><div><label class="title">Ý thức</label><select id="con"><option value="0" selected>A — Tỉnh — 0 điểm</option><option value="3">C — Lú lẫn mới — 3 điểm</option><option value="3">V — Đáp ứng lời nói — 3 điểm</option><option value="3">P — Đáp ứng đau — 3 điểm</option><option value="3">U — Không đáp ứng — 3 điểm</option></select></div><div><label class="title">Nhiệt độ</label><select id="temp"><option value="35" data-score="3">≤ 35,0°C — 3 điểm</option><option value="36" data-score="1">35,1–36,0°C — 1 điểm</option><option value="37" data-score="0" selected>36,1–38,0°C (mặc định 37) — 0 điểm</option><option value="39" data-score="1">38,1–39,0°C — 1 điểm</option><option value="39.1" data-score="2">≥ 39,1°C — 2 điểm</option></select></div></div></div>
<div class="actions"><button class="primary" id="calc">Tính điểm</button><button class="secondary" id="reset">Mặc định</button></div><section id="result" class="result"><div id="score" class="score"></div><div id="risk" class="risk"></div><div id="response" class="response"></div><div id="details" class="details"></div></section></div>
<script>
'use strict';const $=id=>document.getElementById(id);function optScore(id){return Number($(id).selectedOptions[0].dataset.score||0)}
function setSpoOptions(){const scale=document.querySelector('input[name=scale]:checked').value,oxy=$('oxy').checked;let a;if(scale==='1')a=[[91,3,'≤ 91% — 3 điểm'],[93,2,'92–93% — 2 điểm'],[95,1,'94–95% — 1 điểm'],[96,0,'≥ 96% — 0 điểm']];else if(!oxy)a=[[83,3,'≤ 83% — 3 điểm'],[85,2,'84–85% — 2 điểm'],[87,1,'86–87% — 1 điểm'],[92,0,'88–92% — 0 điểm'],[93,0,'≥ 93% khi thở khí phòng — 0 điểm']];else a=[[83,3,'≤ 83% — 3 điểm'],[85,2,'84–85% — 2 điểm'],[87,1,'86–87% — 1 điểm'],[92,0,'88–92% — 0 điểm'],[94,1,'93–94% — 1 điểm'],[96,2,'95–96% — 2 điểm'],[97,3,'≥ 97% — 3 điểm']];$('spo2').innerHTML=a.map((x,i)=>'<option value="'+x[0]+'" data-score="'+x[1]+'" '+((scale==='1'&&x[0]===96)||(!oxy&&scale==='2'&&x[0]===93)||(oxy&&scale==='2'&&x[0]===92)?'selected':'')+'>'+x[2]+'</option>').join('')}
function interpret(total,max){if(total>=7)return['NGUY CƠ CAO — ĐÁP ỨNG CẤP CỨU','Thông báo bác sĩ điều trị ngay; yêu cầu hỗ trợ hồi sức có kỹ năng kiểm soát đường thở nâng cao. Cân nhắc chuyển khu bệnh nặng/ICU và theo dõi liên tục các dấu hiệu sinh tồn.',3];if(total>=5)return['NGUY CƠ TRUNG BÌNH — ĐÁP ỨNG KHẨN CẤP','Thông báo bác sĩ điều trị ngay; yêu cầu bác sĩ đủ năng lực đánh giá diễn tiến cấp tính, cân nhắc kích hoạt đội phản ứng nhanh và chuyển đến khu vực có thiết bị theo dõi. Theo dõi tối thiểu mỗi 1 giờ.',2];if(max===3)return['NGUY CƠ TRUNG BÌNH–THẤP — CÓ MỘT CHỈ SỐ 3 ĐIỂM','Điều dưỡng trực chính thông báo bác sĩ điều trị để đánh giá lại và quyết định kế hoạch can thiệp. Theo dõi tối thiểu mỗi 1 giờ.',1];if(total===0)return['NGUY CƠ THẤP','Tiếp tục theo dõi NEWS2. Theo dõi tối thiểu mỗi 12 giờ, đồng thời điều chỉnh theo tình trạng lâm sàng và quy trình tại đơn vị.',0];return['NGUY CƠ THẤP','Thông báo điều dưỡng trực chính đánh giá bệnh nhân và điều chỉnh kế hoạch chăm sóc khi cần. Theo dõi tối thiểu mỗi 4–6 giờ.',0]}
function postHistory(entry){try{parent.postMessage({type:'BCCT_HISTORY_ADD',entry},'*')}catch(e){}}
$('calc').onclick=()=>{const scale=document.querySelector('input[name=scale]:checked').value,oxy=$('oxy').checked,pts=[optScore('rr'),optScore('spo2'),oxy?2:0,optScore('bp'),optScore('pulse'),Number($('con').value),optScore('temp')],total=pts.reduce((a,b)=>a+b,0),it=interpret(total,Math.max(pts[0],pts[1],pts[3],pts[4],pts[5],pts[6])),rr=$('rr').value,sp=$('spo2').value,bp=$('bp').value,pu=$('pulse').value,te=$('temp').value,palette=[['#e8f5e9','#2e7d32'],['#fff9c4','#b59100'],['#fff3e0','#e67a00'],['#ffebee','#c62828']][it[2]],detail='CHI TIẾT ĐIỂM\n• Nhịp thở '+rr+': '+pts[0]+' điểm\n• SpO₂ '+sp+'% — thang '+scale+': '+pts[1]+' điểm\n• '+(oxy?'Thở oxy bổ sung':'Thở khí phòng')+': '+pts[2]+' điểm\n• Huyết áp tâm thu '+bp+' mmHg: '+pts[3]+' điểm\n• Mạch '+pu+' lần/phút: '+pts[4]+' điểm\n• Ý thức: '+pts[5]+' điểm\n• Nhiệt độ '+Number(te).toFixed(1)+'°C: '+pts[6]+' điểm';$('result').style.display='block';$('result').style.background=palette[0];$('result').style.borderColor=palette[1];$('score').style.color=palette[1];$('score').textContent='NEWS2 = '+total+' điểm';$('risk').textContent=it[0];$('response').textContent=it[1];$('details').textContent=detail;postHistory({tool:'NEWS2',title:'Tính điểm',summary:'NEWS2 = '+total+' điểm • '+it[0],detail});$('result').scrollIntoView({behavior:'smooth'})};
function resetDefaults(){$('rr').value='20';document.querySelector('input[name=scale][value="1"]').checked=true;$('oxy').checked=false;setSpoOptions();$('bp').value='120';$('pulse').value='80';$('con').selectedIndex=0;$('temp').value='37';$('result').style.display='none'}
function liveTotal(){try{const pts=[optScore('rr'),optScore('spo2'),$('oxy').checked?2:0,optScore('bp'),optScore('pulse'),Number($('con').value),optScore('temp')];$('newsLive').textContent='NEWS2 hiện tại: '+pts.reduce((a,b)=>a+b,0)+' điểm'}catch(e){}}$('reset').onclick=()=>{resetDefaults();liveTotal()};document.querySelectorAll('input[name=scale]').forEach(x=>x.onchange=()=>{setSpoOptions();liveTotal()});$('oxy').onchange=()=>{setSpoOptions();liveTotal()};['rr','spo2','bp','pulse','con','temp'].forEach(id=>$(id).addEventListener('change',liveTotal));setSpoOptions();resetDefaults();liveTotal();
</script><script>(function(){function snapshot(){const out={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);out[k]=localStorage.getItem(k)}return out}addEventListener('message',function(e){const m=e.data;if(!m||m.type!=='BCCT_SYNC'||!m.requestId)return;try{if(m.action==='import'){localStorage.clear();for(const [k,v] of Object.entries(m.storage||{}))localStorage.setItem(k,String(v));e.source.postMessage({type:'BCCT_SYNC_RESULT',requestId:m.requestId,ok:true,storage:snapshot()},'*')}else e.source.postMessage({type:'BCCT_SYNC_RESULT',requestId:m.requestId,ok:true,storage:snapshot()},'*')}catch(err){e.source.postMessage({type:'BCCT_SYNC_RESULT',requestId:m.requestId,ok:false,error:String(err&&err.message||err)},'*')}})})();</script>
