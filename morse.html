:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;--sea:#0b3a67;--ocean:#0879a8;--red:#c51f2d;--gold:#f4c542;--paper:#fff8df;--ink:#1d2b3a;--muted:#61717e;color:var(--ink);background:#eaf6fb}*{box-sizing:border-box}html,body{margin:0;max-width:100%;overflow-x:hidden;background:linear-gradient(#dff4ff,#eef8fb)}body{padding:12px 9px calc(24px + env(safe-area-inset-bottom));min-height:100vh}.wrap{width:100%;max-width:720px;margin:auto}.hero{background:linear-gradient(135deg,#072a4d,#0879a8 68%,#c51f2d);border:2px solid var(--gold);color:#fff;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 7px 20px #072a4d38}.hero h1{font-size:23px;margin:0 0 6px}.hero p{font-size:12px;line-height:1.45;margin:0;opacity:.92}.badge{display:inline-flex;align-items:center;gap:5px;margin-top:10px;border-radius:999px;background:#ffffff22;border:1px solid #ffffff44;padding:5px 9px;font-size:11px;font-weight:800}.card{background:#fffdf6;border:1.5px solid #d8c275;border-radius:16px;padding:13px;margin-bottom:10px;box-shadow:0 3px 12px #072a4d16}.card-title{display:block;color:var(--sea);font-weight:850;margin-bottom:8px;font-size:15px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{min-width:0}select,input{width:100%;min-height:52px;border:1px solid #b9ad7f;border-radius:12px;background:#fff;padding:8px 11px;font-size:15px;outline:0}select:focus,input:focus{border-color:var(--ocean);box-shadow:0 0 0 3px #0879a820}.actions{display:grid;grid-template-columns:2fr 1fr;gap:9px;margin:14px 0}button{border:0;border-radius:13px;min-height:52px;font-size:16px;font-weight:850}.primary{background:linear-gradient(135deg,var(--red),#a91723);border:2px solid var(--gold);color:#fff}.secondary{background:#e2f4fa;color:var(--sea);border:1px solid #8bbdd0}.result{display:none;border:2px solid;border-radius:17px;padding:15px;background:#fffdf6}.score{font-size:28px;font-weight:950}.risk{font-weight:900;margin:7px 0}.response{line-height:1.48}.details{white-space:pre-line;margin-top:12px;border-top:1px dashed #cbbd86;padding-top:11px;line-height:1.5;font-size:13px}.note{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:8px}.owner{margin-top:13px;padding:8px 10px;background:var(--sea);color:#fff;border-radius:11px;text-align:center;font-size:10.5px}.owner b{color:#ffe57a}@media(max-width:520px){.row{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.hero h1{font-size:21px}.card{padding:12px}button{font-size:14px}}@media(max-width:360px){.actions{grid-template-columns:1fr}}
.live-score{position:sticky;top:0;z-index:4;margin:-3px 0 10px;padding:10px 12px;border:2px solid var(--gold);border-radius:13px;background:var(--sea);color:#fff;font-weight:900;text-align:center;box-shadow:0 4px 14px #072a4d33}</style>

*{max-width:100%;box-sizing:border-box}html,body{width:100%;max-width:100%;overflow-x:hidden!important}body{touch-action:pan-y}input,select,textarea,button{font-size:16px!important}img,svg,canvas,video{max-width:100%;height:auto}.tmq-owner-footer,.owner{position:static!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;transform:none!important}table{max-width:100%}@media(max-width:600px){body{padding-left:8px!important;padding-right:8px!important}.wrap,main,.container,.shell{width:100%!important;max-width:100%!important;margin-left:auto!important;margin-right:auto!important}.row,.actions,.toolbar{min-width:0}.actions button,.toolbar button{min-height:48px}.hero h1,h1{overflow-wrap:anywhere}}

</head><body><main class="wrap"><section class="hero"><h1>☠️ THANG ĐIỂM MORSE</h1><p>Chọn từng yếu tố nguy cơ té ngã; ứng dụng tự cộng điểm, phân tầng và lưu vào lịch sử.</p><span class="badge">⚓ Mobile-first • Chọn như NEWS2</span></section><div id="liveScore" class="live-score">Đang tính…</div>
<section class="card"><div class="row">
<div class="field"><label class="card-title" for="fall">Tiền sử té ngã trong 3 tháng</label><select id="fall"><option value="0">Không — 0 điểm</option><option value="25">Có — 25 điểm</option></select></div>
<div class="field"><label class="card-title" for="dx">Chẩn đoán thứ hai</label><select id="dx"><option value="0">Không — 0 điểm</option><option value="15">Có — 15 điểm</option></select></div>
</div></section>
<section class="card"><div class="row">
<div class="field"><label class="card-title" for="aid">Phương tiện hỗ trợ đi lại</label><select id="aid"><option value="0">Không / nằm giường / nhân viên hỗ trợ — 0</option><option value="15">Nạng / gậy / khung tập đi — 15</option><option value="30">Bám đồ nội thất — 30</option></select></div>
<div class="field"><label class="card-title" for="iv">Đường truyền tĩnh mạch / khóa heparin</label><select id="iv"><option value="0">Không — 0 điểm</option><option value="20">Có — 20 điểm</option></select></div>
</div></section>
<section class="card"><div class="row">
<div class="field"><label class="card-title" for="gait">Dáng đi / di chuyển</label><select id="gait"><option value="0">Bình thường / nằm giường / bất động — 0</option><option value="10">Yếu — 10 điểm</option><option value="20">Suy giảm rõ — 20 điểm</option></select></div>
<div class="field"><label class="card-title" for="mental">Tình trạng nhận thức</label><select id="mental"><option value="0">Nhận biết đúng khả năng của mình — 0</option><option value="15">Quên hoặc đánh giá quá khả năng — 15</option></select></div>
</div><div class="note">Ngưỡng phân tầng có thể khác giữa các cơ sở; luôn đối chiếu quy trình của đơn vị.</div></section>
<div class="actions"><button id="calc" class="primary">Lưu kết quả Morse</button><button id="reset" class="secondary">Mặc định</button></div>
<section id="result" class="result"><div id="score" class="score"></div><div id="risk" class="risk"></div><div id="response" class="response"></div><div id="details" class="details"></div></section>
<div class="owner">☠️ <b>CHÍNH CHỦ: TRƯƠNG MINH QUÝ</b></div></main>
<script>'use strict';const $=id=>document.getElementById(id),ids=['fall','dx','aid','iv','gait','mental'];function postHistory(entry){try{parent.postMessage({type:'BCCT_HISTORY_ADD',entry},'*')}catch(e){}}function label(id){return $(id).selectedOptions[0].textContent}function interpret(n){if(n>=45)return['NGUY CƠ CAO','Áp dụng biện pháp phòng té ngã mức cao theo quy trình đơn vị; đánh giá lại các yếu tố có thể can thiệp.',2];if(n>=25)return['NGUY CƠ TRUNG BÌNH','Thực hiện phòng ngừa té ngã và xử lý từng yếu tố nguy cơ đã ghi nhận.',1];return['NGUY CƠ THẤP','Duy trì biện pháp an toàn cơ bản và đánh giá lại khi tình trạng thay đổi.',0]}function calculate(save){const pts=ids.map(x=>Number($(x).value)),total=pts.reduce((a,b)=>a+b,0),it=interpret(total),pal=[["#e8f5e9","#2e7d32"],["#fff8df","#9a6700"],["#ffebee","#c62828"]][it[2]],detail='CHI TIẾT ĐIỂM\n'+ids.map(id=>'• '+label(id)).join('\n');$('liveScore').textContent='Morse hiện tại: '+total+' điểm • '+it[0];$('result').style.display='block';$('result').style.background=pal[0];$('result').style.borderColor=pal[1];$('score').style.color=pal[1];$('score').textContent='Morse = '+total+' điểm';$('risk').textContent=it[0];$('response').textContent=it[1];$('details').textContent=detail;if(save){postHistory({tool:'Morse',title:'Đánh giá nguy cơ té ngã',summary:'Morse = '+total+' điểm • '+it[0],detail});$('calc').textContent='✓ Đã lưu kết quả';setTimeout(()=>$('calc').textContent='Lưu kết quả Morse',1200);$('result').scrollIntoView({behavior:'smooth',block:'nearest'})}}$('calc').onclick=()=>calculate(true);$('reset').onclick=()=>{ids.forEach(x=>$(x).selectedIndex=0);calculate(false)};ids.forEach(id=>$(id).addEventListener('change',()=>calculate(false)));calculate(false);</script><script>(function(){function snapshot(){const out={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);out[k]=localStorage.getItem(k)}return out}addEventListener('message',function(e){const m=e.data;if(!m||m.type!=="BCCT_SYNC"||!m.requestId)return;try{if(m.action==="import"){localStorage.clear();for(const [k,v] of Object.entries(m.storage||{}))localStorage.setItem(k,String(v));e.source.postMessage({type:"BCCT_SYNC_RESULT",requestId:m.requestId,ok:true,storage:snapshot()},"*")}else e.source.postMessage({type:"BCCT_SYNC_RESULT",requestId:m.requestId,ok:true,storage:snapshot()},"*")}catch(err){e.source.postMessage({type:"BCCT_SYNC_RESULT",requestId:m.requestId,ok:false,error:String(err&&err.message||err)},"*")}})})();</script></body></html>
