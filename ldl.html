<!doctype html><html lang="vi"><head><meta name="author" content="Trương Minh Quý"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tính LDL-Cholesterol</title><link rel="stylesheet" href="clinical-tool.css"><link rel="stylesheet" href="desktop-theme.css?v=20260909-desktop1"><script src="desktop-theme.js?v=20260909-desktop1" defer></script><link rel="stylesheet" href="win98-theme.css">
</head><body><div class="wrap"><div class="head"><h1>🩸 LDL-Cholesterol</h1><p>Ước tính theo công thức Friedewald cổ điển</p></div><section class="panel"><div class="toggle"><button class="on" data-unit="mmol">mmol/L</button><button data-unit="mg">mg/dL</button></div><div class="row"><div><label>Cholesterol toàn phần (TC)</label><input id="tc" type="number" min="0" step="0.01"></div><div><label>HDL-C</label><input id="hdl" type="number" min="0" step="0.01"></div></div><label>Triglycerid (TG)</label><input id="tg" type="number" min="0" step="0.01"><button class="action" id="calc">Tính LDL-C</button><div class="result" id="result"><strong>--</strong><small>Nhập đủ ba thông số để tính.</small></div><div class="info" id="formula">LDL-C = TC − HDL-C − TG/2.2 (mmol/L). Không dùng công thức cổ điển khi TG ≥ 4,5 mmol/L.</div></section><footer class="owner">© 2026 <b>TRƯƠNG MINH QUÝ</b> • All rights reserved.</footer></div><script>
const $=id=>document.getElementById(id);let unit='mmol';function hist(entry){try{parent.postMessage({type:'BCCT_HISTORY_ADD',entry},'*')}catch(e){}}document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{unit=b.dataset.unit;document.querySelectorAll('[data-unit]').forEach(x=>x.classList.toggle('on',x===b));$('formula').textContent=unit==='mmol'?'LDL-C = TC − HDL-C − TG/2.2 (mmol/L). Không dùng công thức cổ điển khi TG ≥ 4,5 mmol/L.':'LDL-C = TC − HDL-C − TG/5 (mg/dL). Không dùng công thức cổ điển khi TG ≥ 400 mg/dL.'});$('calc').onclick=()=>{const tc=Number($('tc').value),hdl=Number($('hdl').value),tg=Number($('tg').value),r=$('result');if(![tc,hdl,tg].every(v=>Number.isFinite(v)&&v>=0)){r.innerHTML='<strong>--</strong><small>Vui lòng nhập đủ giá trị hợp lệ.</small>';return}const high=unit==='mmol'?tg>=4.5:tg>=400;if(high){r.className='result warn';r.innerHTML='<strong>Không áp dụng</strong><small>Triglycerid quá cao cho công thức Friedewald cổ điển.</small>';return}const val=tc-hdl-tg/(unit==='mmol'?2.2:5);r.className='result';r.innerHTML=`<strong>${val.toFixed(2)} ${unit==='mmol'?'mmol/L':'mg/dL'}</strong><small>Ước tính theo Friedewald.</small>`;hist({tool:'LDL-C',title:'Tính LDL-Cholesterol',summary:`LDL-C ${val.toFixed(2)} ${unit==='mmol'?'mmol/L':'mg/dL'}`})};

(function(){function snapshot(){const out={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);out[k]=localStorage.getItem(k)}return out}addEventListener('message',function(e){const m=e.data;if(!m||m.type!=='BCCT_SYNC'||!m.requestId)return;try{if(m.action==='import'){localStorage.clear();for(const [k,v] of Object.entries(m.storage||{}))localStorage.setItem(k,String(v))}e.source.postMessage({type:'BCCT_SYNC_RESULT',requestId:m.requestId,ok:true,storage:snapshot()},'*')}catch(err){e.source.postMessage({type:'BCCT_SYNC_RESULT',requestId:m.requestId,ok:false,error:String(err&&err.message||err)},'*')}})})();
</script></body></html>
