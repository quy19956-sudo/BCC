<!doctype html><html lang="vi"><head><script src="bcct-fast-sync.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="author" content="Trương Minh Quý"><title>Thang điểm Braden</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;--sea:#0b3a67;--ocean:#0879a8;--red:#c51f2d;--gold:#f4c542;--paper:#fff8df;--ink:#1d2b3a;--muted:#61717e;color:var(--ink);background:#eaf6fb}*{box-sizing:border-box}html,body{margin:0;max-width:100%;overflow-x:hidden;background:linear-gradient(#dff4ff,#eef8fb)}body{padding:12px 9px calc(24px + env(safe-area-inset-bottom));min-height:100vh}.wrap{width:100%;max-width:720px;margin:auto}.hero{background:linear-gradient(135deg,#072a4d,#0879a8 68%,#c51f2d);border:2px solid var(--gold);color:#fff;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 7px 20px #072a4d38}.hero h1{font-size:23px;margin:0 0 6px}.hero p{font-size:12px;line-height:1.45;margin:0;opacity:.92}.badge{display:inline-flex;align-items:center;gap:5px;margin-top:10px;border-radius:999px;background:#ffffff22;border:1px solid #ffffff44;padding:5px 9px;font-size:11px;font-weight:800}.card{background:#fffdf6;border:1.5px solid #d8c275;border-radius:16px;padding:13px;margin-bottom:10px;box-shadow:0 3px 12px #072a4d16}.card-title{display:block;color:var(--sea);font-weight:850;margin-bottom:8px;font-size:15px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{min-width:0}select,input{width:100%;min-height:52px;border:1px solid #b9ad7f;border-radius:12px;background:#fff;padding:8px 11px;font-size:15px;outline:0}select:focus,input:focus{border-color:var(--ocean);box-shadow:0 0 0 3px #0879a820}.actions{display:grid;grid-template-columns:2fr 1fr;gap:9px;margin:14px 0}button{border:0;border-radius:13px;min-height:52px;font-size:16px;font-weight:850}.primary{background:linear-gradient(135deg,var(--red),#a91723);border:2px solid var(--gold);color:#fff}.secondary{background:#e2f4fa;color:var(--sea);border:1px solid #8bbdd0}.result{display:none;border:2px solid;border-radius:17px;padding:15px;background:#fffdf6}.score{font-size:28px;font-weight:950}.risk{font-weight:900;margin:7px 0}.response{line-height:1.48}.details{white-space:pre-line;margin-top:12px;border-top:1px dashed #cbbd86;padding-top:11px;line-height:1.5;font-size:13px}.note{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:8px}.owner{margin-top:13px;padding:8px 10px;background:var(--sea);color:#fff;border-radius:11px;text-align:center;font-size:10.5px}.owner b{color:#ffe57a}@media(max-width:520px){.row{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.hero h1{font-size:21px}.card{padding:12px}button{font-size:14px}}@media(max-width:360px){.actions{grid-template-columns:1fr}}
.live-score{position:sticky;top:0;z-index:4;margin:-3px 0 10px;padding:10px 12px;border:2px solid var(--gold);border-radius:13px;background:var(--sea);color:#fff;font-weight:900;text-align:center;box-shadow:0 4px 14px #072a4d33}</style>

<link rel="stylesheet" href="bcct-runtime.css"><script defer src="bcct-runtime.js"></script></head><body><main class="wrap"><section class="hero"><h1>🏴‍☠️ THANG ĐIỂM BRADEN</h1><p>Đánh giá nhanh nguy cơ tổn thương do tỳ đè bằng sáu tiêu chí; điểm càng thấp, nguy cơ càng cao.</p><span class="badge">⚓ Mobile-first • Tự cộng điểm</span></section><div id="liveScore" class="live-score">Đang tính…</div>
<section class="card"><div class="row">
<div class="field"><label class="card-title" for="sensory">Nhận cảm giác</label><select id="sensory"><option value="4">Không suy giảm — 4 điểm</option><option value="3">Suy giảm nhẹ — 3 điểm</option><option value="2">Suy giảm nhiều — 2 điểm</option><option value="1">Hạn chế hoàn toàn — 1 điểm</option></select></div>
<div class="field"><label class="card-title" for="moisture">Độ ẩm da</label><select id="moisture"><option value="4">Hiếm khi ẩm — 4 điểm</option><option value="3">Thỉnh thoảng ẩm — 3 điểm</option><option value="2">Rất ẩm — 2 điểm</option><option value="1">Ẩm liên tục — 1 điểm</option></select></div>
</div></section>
<section class="card"><div class="row">
<div class="field"><label class="card-title" for="activity">Hoạt động</label><select id="activity"><option value="4">Đi lại thường xuyên — 4 điểm</option><option value="3">Thỉnh thoảng đi lại — 3 điểm</option><option value="2">Chỉ ngồi ghế — 2 điểm</option><option value="1">Nằm giường — 1 điểm</option></select></div>
<div class="field"><label class="card-title" for="mobility">Khả năng thay đổi tư thế</label><select id="mobility"><option value="4">Không hạn chế — 4 điểm</option><option value="3">Hạn chế nhẹ — 3 điểm</option><option value="2">Rất hạn chế — 2 điểm</option><option value="1">Bất động hoàn toàn — 1 điểm</option></select></div>
</div></section>
<section class="card"><div class="row">
<div class="field"><label class="card-title" for="nutrition">Dinh dưỡng</label><select id="nutrition"><option value="4">Rất tốt — 4 điểm</option><option value="3">Đầy đủ — 3 điểm</option><option value="2">Có thể không đầy đủ — 2 điểm</option><option value="1">Rất kém — 1 điểm</option></select></div>
<div class="field"><label class="card-title" for="friction">Ma sát và lực trượt</label><select id="friction"><option value="3">Không có vấn đề rõ — 3 điểm</option><option value="2">Có nguy cơ — 2 điểm</option><option value="1">Có vấn đề — 1 điểm</option></select></div>
</div><div class="note">Phân tầng chỉ để hỗ trợ sàng lọc; kế hoạch phòng ngừa cần theo đánh giá lâm sàng và quy trình của đơn vị.</div></section>
<div class="actions"><button id="calc" class="primary">Lưu kết quả Braden</button><button id="reset" class="secondary">Mặc định</button></div>
<section id="result" class="result"><div id="score" class="score"></div><div id="risk" class="risk"></div><div id="response" class="response"></div><div id="details" class="details"></div></section><div class="owner">☠️ <b>CHÍNH CHỦ: TRƯƠNG MINH QUÝ</b></div></main>
<script>'use strict';const $=id=>document.getElementById(id),ids=['sensory','moisture','activity','mobility','nutrition','friction'];function postHistory(entry){try{parent.postMessage({type:'BCCT_HISTORY_ADD',entry},'*')}catch(e){}}function label(id){return $(id).selectedOptions[0].textContent}function interpret(n){if(n<=9)return['NGUY CƠ RẤT CAO','Kích hoạt kế hoạch phòng tổn thương do tỳ đè mức rất cao và theo dõi sát theo quy trình đơn vị.',4];if(n<=12)return['NGUY CƠ CAO','Triển khai phòng ngừa tích cực: quản lý áp lực, da, độ ẩm, dinh dưỡng và vận động.',3];if(n<=14)return['NGUY CƠ TRUNG BÌNH','Lập kế hoạch phòng ngừa theo các tiêu chí điểm thấp và đánh giá lại định kỳ.',2];if(n<=18)return['CÓ NGUY CƠ','Áp dụng biện pháp phòng ngừa cơ bản và theo dõi các yếu tố nguy cơ.',1];return['NGUY CƠ THẤP','Tiếp tục chăm sóc da, vận động và đánh giá lại khi tình trạng thay đổi.',0]}function calculate(save){const pts=ids.map(x=>Number($(x).value)),total=pts.reduce((a,b)=>a+b,0),it=interpret(total),pal=[["#e8f5e9","#2e7d32"],["#fffde7","#8a7000"],["#fff3e0","#e67a00"],["#ffebee","#c62828"],["#fce4ec","#9c1b49"]][it[2]],detail='CHI TIẾT ĐIỂM\n'+ids.map(id=>'• '+label(id)).join('\n');$('liveScore').textContent='Braden hiện tại: '+total+' điểm • '+it[0];$('result').style.display='block';$('result').style.background=pal[0];$('result').style.borderColor=pal[1];$('score').style.color=pal[1];$('score').textContent='Braden = '+total+' điểm';$('risk').textContent=it[0];$('response').textContent=it[1];$('details').textContent=detail;if(save){postHistory({tool:'Braden',title:'Đánh giá nguy cơ tỳ đè',summary:'Braden = '+total+' điểm • '+it[0],detail});$('calc').textContent='✓ Đã lưu kết quả';setTimeout(()=>$('calc').textContent='Lưu kết quả Braden',1200);$('result').scrollIntoView({behavior:'smooth',block:'nearest'})}}$('calc').onclick=()=>calculate(true);$('reset').onclick=()=>{ids.forEach(x=>$(x).selectedIndex=0);calculate(false)};ids.forEach(id=>$(id).addEventListener('change',()=>calculate(false)));calculate(false);</script><script>(function(){function snapshot(){const out={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);out[k]=localStorage.getItem(k)}return out}addEventListener('message',function(e){const m=e.data;if(!m||m.type!=="BCCT_SYNC"||!m.requestId)return;try{if(m.action==="import"){localStorage.clear();for(const [k,v] of Object.entries(m.storage||{}))localStorage.setItem(k,String(v));e.source.postMessage({type:"BCCT_SYNC_RESULT",requestId:m.requestId,ok:true,storage:snapshot()},"*")}else e.source.postMessage({type:"BCCT_SYNC_RESULT",requestId:m.requestId,ok:true,storage:snapshot()},"*")}catch(err){e.source.postMessage({type:"BCCT_SYNC_RESULT",requestId:m.requestId,ok:false,error:String(err&&err.message||err)},"*")}})})();</script></body></html>
