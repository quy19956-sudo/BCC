'use strict';
const $=id=>document.getElementById(id),KEY='bcct_qr_scan_history_v4';let rawText='',stream=null,videoTrack=null,scanTimer=0,nativeFrameBusy=false,nativeFound=false,nativeFocusTimer=0,torchOn=false,manualTorch=false,darkFrames=0,facing='environment';

function parseInferredIdentity(parts){const now=new Date().getFullYear(),used=new Set(),fields=[];let id='',old='',name='',dob='',issue='',gender='',address='',locationCode='';
 for(let i=0;i<parts.length;i++){const v=parts[i];if(!id&&/^\d{12}$/.test(v)){id=v;used.add(i);break}}
 if(!id)for(let i=0;i<parts.length;i++){const v=parts[i];if(/^\d{9,12}$/.test(v)){id=v;used.add(i);break}}
 for(let i=0;i<parts.length;i++){if(used.has(i))continue;const v=parts[i];if(!name&&isName(v)){name=v;used.add(i);break}}
 const dates=[];for(let i=0;i<parts.length;i++)if(!used.has(i)&&isDate(parts[i]))dates.push({i,v:normDate(parts[i]),y:yearOf(parts[i])});const birth=dates.filter(x=>x.y>=1900&&x.y<=now-5).sort((a,b)=>a.y-b.y)[0];if(birth){dob=birth.v;used.add(birth.i)}const issued=dates.filter(x=>!used.has(x.i)&&x.y>=1990&&x.y<=now+1).sort((a,b)=>b.y-a.y)[0];if(issued){issue=issued.v;used.add(issued.i)}

function renderParsed(p){$('person').classList.remove('hidden');$('personGrid').innerHTML='<div class="item" style="grid-column:1/-1"><small>Loại mã</small><b>'+esc(p.type)+'</b></div>'+(p.warning?'<div class="parse-warning">'+esc(p.warning)+'</div>':'')+p.fields.filter(x=>x[1]).map(x=>'<div class="item"><small>'+esc(x[0])+'</small><b>'+esc(x[1])+'</b></div>').join('');$('raw').textContent=rawText}
function rotatedCanvas(src,deg){const c=document.createElement('canvas'),ctx=c.getContext('2d',{willReadFrequently:true}),swap=deg%180!==0;c.width=swap?src.height:src.width;c.height=swap?src.width:src.height;ctx.translate(c.width/2,c.height/2);ctx.rotate(deg*Math.PI/180);ctx.drawImage(src,-src.width/2,-src.height/2);return c}

function averageLuma(canvas){const ctx=canvas.getContext('2d',{willReadFrequently:true}),w=Math.min(64,canvas.width),h=Math.min(64,canvas.height),tmp=document.createElement('canvas');tmp.width=w;tmp.height=h;tmp.getContext('2d').drawImage(canvas,0,0,canvas.width,canvas.height,0,0,w,h);const d=tmp.getContext('2d').getImageData(0,0,w,h).data;let sum=0;for(let i=0;i<d.length;i+=16)sum+=(d[i]+d[i+1]+d[i+2])/3;return sum/(d.length/16)}
async function applyFocus(force){if(!videoTrack)return false;try{const cap=videoTrack.getCapabilities?videoTrack.getCapabilities():{},adv=[];if(cap.focusMode&&cap.focusMode.includes('continuous'))adv.push({focusMode:'continuous'});else if(force&&cap.focusMode&&cap.focusMode.includes('single-shot'))adv.push({focusMode:'single-shot'});if(cap.zoom){const target=Math.min(cap.max||1.3,Math.max(cap.min||1,1.15));adv.push({zoom:target})}if(adv.length)await videoTrack.applyConstraints({advanced:adv});return true}catch(_e){return false}}

function stopCamera(){clearInterval(scanTimer);scanTimer=0;clearInterval(nativeFocusTimer);nativeFocusTimer=0;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}videoTrack=null;$('cameraVideo').srcObject=null;$('liveCamera').style.display='none';try{if(window.qrCamera&&typeof qrCamera.closeCamera==='function')qrCamera.closeCamera()}catch(_e){}torchOn=false;$('torchCamera').textContent='🔦 BẬT ĐÈN';$('torchCamera').classList.remove('torch-on')}
window.__bcctCameraStatus=function(message,kind){stat(String(message||''),kind||'warn')};
window.__bcctNativeFrame=function(src){if(nativeFrameBusy||nativeFound||!src)return;nativeFrameBusy=true;const img=new Image();img.onload=function(){try{const max=1900,scale=Math.min(1,max/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height)),frame=document.createElement('canvas');frame.width=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));frame.height=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));frame.getContext('2d',{willReadFrequently:true}).drawImage(img,0,0,frame.width,frame.height);const found=decodeVariants(frame);if(found)completeCode(found)}catch(e){console.warn(e)}finally{nativeFrameBusy=false}};img.onerror=()=>{nativeFrameBusy=false};img.src=src};
$('openCamera').onclick=openSmartCamera;$('closeCamera').onclick=stopCamera;$('switchCamera').onclick=async()=>{facing=facing==='environment'?'user':'environment';if(stream)await openSmartCamera();else try{if(window.qrCamera&&typeof qrCamera.switchCamera==='function')qrCamera.switchCamera()}catch(_e){}};$('torchCamera').onclick=()=>setTorch(!torchOn,false);$('focusCamera').onclick=async()=>{const ok=await applyFocus(true);if(!ok&&!requestNativeFocus())stat('Thiết bị không cung cấp lệnh lấy nét thủ công; hãy đưa QR gần hơn rồi lùi chậm.','warn');else stat('Đã yêu cầu camera lấy nét lại.','ok')};$('cameraVideo').onclick=()=>applyFocus(true);$('choose').onclick=()=>{$('galleryInput').click()};$('galleryInput').onchange=e=>scanFile(e.target.files&&e.target.files[0]);$('clearHistory').onclick=()=>{if(confirm('Xóa toàn bộ lịch sử quét QR?'))saveHistory([])};addEventListener('pagehide',stopCamera);renderHistory();
</script><script>(function(){function snapshot(){const o={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);o[k]=localStorage.getItem(k)}return o}addEventListener('message',e=>{const m=e.data;if(!m||m.type!=='BCCT_SYNC'||!m.requestId)return;try{if(m.action==='import'){localStorage.clear();for(const [k,v] of Object.entries(m.storage||{}))localStorage.setItem(k,String(v));location.reload()}e.source.postMessage({type:'BCCT_SYNC_RESULT',requestId:m.requestId,ok:true,storage:snapshot()},'*')}catch(err){e.source.postMessage({type:'BCCT_SYNC_RESULT',requestId:m.requestId,ok:false,error:String(err&&err.message||err)},'*')}})})();</script></body></html>
