<link rel="stylesheet" href="bcct-runtime.css"><script defer src="bcct-runtime.js"></script></head><body><div class="wrap"><div class="head"><h1>TÍNH BMI</h1><p>Nhập chiều cao và cân nặng</p></div><section class="card"><label for="h">Chiều cao (cm)</label><input id="h" inputmode="decimal" placeholder="Ví dụ: 165"><label for="w">Cân nặng (kg)</label><input id="w" inputmode="decimal" placeholder="Ví dụ: 60"><div class="result"><div id="value" class="value">BMI: --</div><div id="class" class="class">Chưa đủ dữ liệu</div></div><div class="hint">BMI chỉ mang tính tham khảo và không thay thế đánh giá của nhân viên y tế.</div></section></div><script>
const h=document.getElementById('h'),w=document.getElementById('w'),v=document.getElementById('value'),c=document.getElementById('class');let logTimer=null,lastLogged='';function num(x){return Number(String(x).trim().replace(',','.'))}function postHistory(entry){try{parent.postMessage({type:'BCCT_HISTORY_ADD',entry},'*')}catch(e){}}function calc(){const cm=num(h.value),kg=num(w.value);if(!(Number.isFinite(cm)&&Number.isFinite(kg)&&cm>0&&kg>0&&Number.isFinite(kg/((cm/100)**2)))){v.textContent='BMI: --';c.textContent='Chưa đủ dữ liệu';clearTimeout(logTimer);return}const bmi=kg/((cm/100)**2),cls=bmi<18.5?'Thiếu cân':bmi<23?'Bình thường':bmi<25?'Thừa cân':bmi<30?'Béo phì độ I':bmi<35?'Béo phì độ II':'Béo phì độ III';v.textContent='BMI: '+bmi.toFixed(1);c.textContent=cls;clearTimeout(logTimer);const key=cm+'|'+kg+'|'+bmi.toFixed(1);logTimer=setTimeout(()=>{if(key!==lastLogged){lastLogged=key;postHistory({tool:'BMI',title:'Tính BMI',summary:'Chiều cao '+cm+' cm • Cân nặng '+kg+' kg • BMI '+bmi.toFixed(1)+' — '+cls,detail:'BMI chỉ mang tính tham khảo và không thay thế đánh giá của nhân viên y tế.'})}},850)}h.addEventListener('input',calc);w.addEventListener('input',calc);
</script><script>
(function(){
  function snapshot(){const out={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);out[k]=localStorage.getItem(k)}return out}
  addEventListener('message',function(e){const m=e.data;if(!m||m.type!=='BCCT_SYNC'||!m.requestId)return;try{if(m.action==='import'){localStorage.clear();for(const [k,v] of Object.entries(m.storage||{}))localStorage.setItem(k,String(v));e.source.postMessage({type:'BCCT_SYNC_RESULT',requestId:m.requestId,ok:true,storage:snapshot()},'*')}else{e.source.postMessage({type:'BCCT_SYNC_RESULT',requestId:m.requestId,ok:true,storage:snapshot()},'*')}}catch(err){e.source.postMessage({type:'BCCT_SYNC_RESULT',requestId:m.requestId,ok:false,error:String(err&&err.message||err)},'*')}})
})();
</script>
