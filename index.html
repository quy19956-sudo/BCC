const HISTORY_KEY='BCCT_HISTORY_V3',BACKUP_KEY='BCCT_LAST_BACKUP_V3',BACKUP_AT_KEY='BCCT_LAST_BACKUP_AT_V3',BACKUP_FILE_KEY='BCCT_LAST_BACKUP_FILE_V3';
const home=document.getElementById('home'),frame=document.getElementById('frame'),back=document.getElementById('back'),title=document.getElementById('title');

function loadHistory(){try{const x=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}}
function saveHistory(list){let out=list.slice(0,400);while(JSON.stringify(out).length>3300000&&out.length>10)out.pop();localStorage.setItem(HISTORY_KEY,JSON.stringify(out));updateHistoryCount()}
function addHistory(entry){const item={id:Date.now().toString(36)+Math.random().toString(36).slice(2,8),time:new Date().toISOString(),tool:entry.tool||'Hệ thống',title:entry.title||'Hoạt động',summary:entry.summary||'',detail:entry.detail||'',issues:Array.isArray(entry.issues)?entry.issues.slice(0,500):[]};const list=loadHistory();list.unshift(item);saveHistory(list)}

function renderHistory(){const f=document.getElementById('historyFilter').value;const list=loadHistory().filter(x=>f==='all'||x.tool===f),box=document.getElementById('historyList');if(!list.length){box.innerHTML='<div class="empty">Chưa có lịch sử phù hợp.</div>';return}box.innerHTML=list.map(x=>{const issues=(x.issues||[]).map(i=>'<div class="issue '+(i.level==='Cảnh báo'?'warn':'')+'"><b>'+esc(i.level||'')+' • '+esc(i.type||'')+'</b><br>'+esc((i.sheet?i.sheet+'!'+i.row+' • ':'')+(i.detail||''))+'</div>').join('');return '<article class="hist"><div class="histHead"><b>'+esc(x.tool)+' — '+esc(x.title)+'</b><time>'+new Date(x.time).toLocaleString('vi-VN')+'</time></div><p>'+esc(x.summary)+'</p>'+((x.detail||issues)?'<details><summary>Xem chi tiết</summary><p>'+esc(x.detail)+'</p>'+issues+'</details>':'')+'</article>'}).join('')}

document.getElementById('historyModal').addEventListener('click',e=>{if(e.target.id==='historyModal')e.currentTarget.style.display='none'});

function bytesToBase64(bytes){let s='';const step=0x8000;for(let i=0;i<bytes.length;i+=step)s+=String.fromCharCode(...bytes.subarray(i,i+step));return btoa(s)}
function base64ToBytes(text){text=text.replace(/-/g,'+').replace(/_/g,'/');while(text.length%4)text+='=';const s=atob(text),out=new Uint8Array(s.length);for(let i=0;i<s.length;i++)out[i]=s.charCodeAt(i);return out}

async function gunzip(bytes){if(!('DecompressionStream' in window))throw new Error('Máy chưa hỗ trợ giải nén bản sao lưu.');const ds=new DecompressionStream('gzip'),w=ds.writable.getWriter();w.write(bytes);w.close();return new Uint8Array(await new Response(ds.readable).arrayBuffer())}
function ownStorage(){const storage={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k!==BACKUP_KEY&&k!==BACKUP_AT_KEY&&k!==BACKUP_FILE_KEY)storage[k]=localStorage.getItem(k)}return storage}
function syncTool(file,action,storage,removeKeys,indexedDBPayload){return new Promise((resolve,reject)=>{const iframe=document.getElementById('syncFrame'),requestId='bcct_'+Date.now()+'_'+Math.random().toString(36).slice(2);let done=false;const cleanup=()=>{removeEventListener('message',onMessage);clearTimeout(timer);iframe.onload=null};const finish=(err,value)=>{if(done)return;done=true;cleanup();err?reject(err):resolve(value)};const onMessage=e=>{const m=e.data;if(e.source===iframe.contentWindow&&m&&m.requestId===requestId&&m.type==='BCCT_SYNC_RESULT')finish(m.ok===false?new Error(m.error||'Không đồng bộ được '+file):null,{storage:m.storage||{},indexedDB:m.indexedDB||null,indexedDBStats:m.indexedDBStats||null})};addEventListener('message',onMessage);const timer=setTimeout(()=>finish(new Error('Quá thời gian đồng bộ '+file)),file==='drug-lookup.html'?300000:90000);iframe.onload=()=>{try{iframe.contentWindow.postMessage({type:'BCCT_SYNC',requestId,action,storage:storage||{},removeKeys:removeKeys||[],indexedDB:indexedDBPayload||null},'*')}catch(e){finish(e)}};iframe.src=file+'#sync='+encodeURIComponent(requestId)})}
addEventListener('message',async e=>{const m=e.data;if(!m||m.type!=='BCCT_MILK_DATA_REQUEST'||!m.requestId)return;const target=e.source;try{const r=await syncTool('tinh-sua-tre-em.html','export'),raw=(r.storage||{}).MILK_TRACKER_V1;let rows=[];try{const x=JSON.parse(raw||'[]');if(Array.isArray(x))rows=x}catch(_e){}rows=rows.map((x,i)=>({name:String(x&&x.name||''),dob:String(x&&x.dob||''),date:String(x&&x.date||''),weight:Number(x&&x.weight||0),length:Number(x&&x.length||0),head:Number(x&&x.head||0),birthWeight:Number(x&&x.birthWeight||0),key:String(x&&x.key||''),sourceOrder:Number(x&&x.sourceOrder||i+1)})).filter(x=>x.name&&x.dob&&x.date&&x.weight>0);target.postMessage({type:'BCCT_MILK_DATA_RESULT',requestId:m.requestId,ok:true,rows},'*')}catch(err){try{target.postMessage({type:'BCCT_MILK_DATA_RESULT',requestId:m.requestId,ok:false,error:String(err&&err.message||err)},'*')}catch(_e){}}});

async function collectBackup(){const stores={'index.html':ownStorage()},databases={},backupStats={offlineDrugRecords:0,offlineImages:0,offlineImageBytes:0,idbRecords:0};for(const file of TOOL_FILES){const r=await syncTool(file,'export'),st=r.storage||{};delete st[BACKUP_KEY];delete st[BACKUP_AT_KEY];delete st[BACKUP_FILE_KEY];stores[file]=st;if(r.indexedDB){databases[file]=r.indexedDB;const x=r.indexedDBStats||r.indexedDB.stats||{};backupStats.offlineImages=Number(x.blobCount||0);backupStats.offlineImageBytes=Number(x.blobBytes||0);backupStats.idbRecords=Number(x.records||0);const db=(r.indexedDB.databases||[]).find(d=>d&&d.name==='bcct_longchau_offline_v4');if(db){const ps=(db.stores||[]).find(z=>z&&z.name==='products');backupStats.offlineDrugRecords=ps&&Array.isArray(ps.records)?ps.records.length:0}}}backupStats.localStorageKeys=Object.values(stores).reduce((n,x)=>n+Object.keys(x||{}).length,0);return{format:'BO_CONG_CU_TONG_HOP',version:5,appVersion:APP_VERSION,versionCode:VERSION_CODE,createdAt:new Date().toISOString(),stores,databases,backupStats}}
async function encodeBackup(data){const raw=new TextEncoder().encode(JSON.stringify(data));try{const packed=await gzip(raw);if(packed&&packed.length<raw.length)return'BCCT5G:'+bytesToBase64(packed)}catch(e){}return'BCCT5:'+bytesToBase64(raw)}
async function decodeBackup(code){let gz=false,prefix='';for(const p of ['BCCT5G:','BCCT5:','BCCT4G:','BCCT4:','BCCT3G:','BCCT3:'])if(code.startsWith(p)){prefix=p;gz=p.endsWith('G:');break}if(!prefix)throw new Error('Bản sao lưu không đúng định dạng.');let bytes=base64ToBytes(code.slice(prefix.length));if(gz)bytes=await gunzip(bytes);const data=JSON.parse(new TextDecoder().decode(bytes));if(!data||data.format!=='BO_CONG_CU_TONG_HOP'||![3,4,5].includes(Number(data.version))||typeof data.stores!=='object')throw new Error('Bản sao lưu không hợp lệ.');return data}
const STAFF_V4='heart_staff_saved_v4',RULES_V4='heart_rules_saved_v4';
const STAFF_OLD=['heart_staff_saved_v1','heart_staff_saved_v2','heart_staff_saved_v3'],RULES_OLD=['heart_rules_saved_v1','heart_rules_saved_v2','heart_rules_saved_v3'];
function firstValue(obj,keys){for(const k of keys)if(obj&&obj[k]!=null)return obj[k];return null}
function normalizedHeartStore(src){src={...(src||{})};if(src[STAFF_V4]==null){const v=firstValue(src,STAFF_OLD);if(v!=null)src[STAFF_V4]=v}if(src[RULES_V4]==null){const v=firstValue(src,RULES_OLD);if(v!=null)src[RULES_V4]=v}for(const k of [...STAFF_OLD,...RULES_OLD])delete src[k];return src}
async function restoreBackupData(data,scope){const stores=data.stores||{},heart=normalizedHeartStore(stores['kiem-tra-thu-thuat-376.html']||stores['kiem-tra-thu-thuat-375.html']||stores['kiem-tra-thu-thuat-374.html']||stores['kiem-tra-thu-thuat-373.html']||stores['kiem-tra-thu-thuat-372.html']||stores['kiem-tra-thu-thuat.html']||{}),heartFile='kiem-tra-thu-thuat-376.html';
 if(scope==='all'){localStorage.clear();for(const [k,v] of Object.entries(stores['index.html']||{}))localStorage.setItem(k,String(v));for(const file of TOOL_FILES){const dbPayload=data.databases&&data.databases[file]?data.databases[file]:null;await syncTool(file,'import',file===heartFile?heart:(stores[file]||{}),[],dbPayload)}return data.version>=4?'toàn bộ ứng dụng, gồm thuốc và ảnh ngoại tuyến':'toàn bộ dữ liệu chữ từ bản sao lưu cũ (bản cũ không chứa ảnh/IndexedDB)'}
 if(scope==='history'){const v=(stores['index.html']||{})[HISTORY_KEY];if(v==null)localStorage.removeItem(HISTORY_KEY);else localStorage.setItem(HISTORY_KEY,String(v));return 'lịch sử'}
 if(scope==='staff'){const v=heart[STAFF_V4],set=v==null?{}:{[STAFF_V4]:v};await syncTool(heartFile,'merge',set,[STAFF_V4,...STAFF_OLD]);return 'bảng danh sách nhân viên'}
 if(scope==='rules'){const v=heart[RULES_V4],set=v==null?{}:{[RULES_V4]:v};await syncTool(heartFile,'merge',set,[RULES_V4,...RULES_OLD]);return 'bảng danh mục thủ thuật'}
 const set={};if(heart[STAFF_V4]!=null)set[STAFF_V4]=heart[STAFF_V4];if(heart[RULES_V4]!=null)set[RULES_V4]=heart[RULES_V4];await syncTool(heartFile,'merge',set,[STAFF_V4,RULES_V4,...STAFF_OLD,...RULES_OLD]);return 'hai bảng thủ thuật'}
function nativeBridge(){try{return typeof window.backupAndroid!=='undefined'&&window.backupAndroid!=null}catch(e){return false}}
function saveBackupFile(code){if(nativeBridge()){let result='';try{result=String(window.backupAndroid.saveBackup(code)||'')}catch(e){throw new Error('Cầu nối Android lỗi: '+(e&&e.message?e.message:String(e)))}if(!result||result.startsWith('ERROR:'))throw new Error(result.replace(/^ERROR:/,'')||'Không lưu được tệp sao lưu.');return result}const d=new Date(),pad=n=>String(n).padStart(2,'0'),name='BCCT_FullBackupV5_'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes())+'.bcct',blob=new Blob([code],{type:'application/octet-stream'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);return name}
function loadLatestBackupFile(){if(!nativeBridge())return'';let result='';try{result=String(window.backupAndroid.loadLatestBackup()||'')}catch(e){throw new Error('Cầu nối Android lỗi: '+(e&&e.message?e.message:String(e)))}if(result.startsWith('ERROR:'))throw new Error(result.replace(/^ERROR:/,''));return result}
function updateBackupStatus(){const at=localStorage.getItem(BACKUP_AT_KEY),file=localStorage.getItem(BACKUP_FILE_KEY),el=document.getElementById('backupStatus');if(at){el.className='status ok';el.textContent='Bản gần nhất: '+new Date(at).toLocaleString('vi-VN')+(file?' • '+file:' • Download/sao luu app riêng')}else{el.className='status';el.textContent='Chưa có bản sao lưu trong Download/sao luu app riêng.'}}
document.getElementById('backupBtn').onclick=async function(){const b=this;b.disabled=true;const old=b.textContent;b.textContent='Đang gom toàn bộ dữ liệu…';try{const data=await collectBackup(),code=await encodeBackup(data),bs=data.backupStats||{};localStorage.removeItem(BACKUP_KEY);let file='';try{file=saveBackupFile(code)}catch(nativeError){const detail=nativeError&&nativeError.message?nativeError.message:String(nativeError);localStorage.setItem(BACKUP_FILE_KEY,'CHƯA lưu vào Download • '+detail);updateBackupStatus();throw nativeError}localStorage.setItem(BACKUP_AT_KEY,data.createdAt);localStorage.setItem(BACKUP_FILE_KEY,file);const encodedBytes=Math.ceil(code.length*3/4);addHistory({tool:'Hệ thống',title:'Full Backup V5',summary:'Đã lưu '+Number(bs.offlineDrugRecords||0)+' thuốc offline, '+Number(bs.offlineImages||0)+' ảnh ('+formatBytes(bs.offlineImageBytes||0)+'), '+Number(bs.localStorageKeys||0)+' mục dữ liệu vào '+file+'.'});updateBackupStatus();document.getElementById('backupStatus').className='status ok';document.getElementById('backupStatus').textContent='FULL BACKUP V5: '+file+' • '+Number(bs.localStorageKeys||0)+' mục dữ liệu • '+Number(bs.offlineDrugRecords||0)+' thuốc offline • '+Number(bs.offlineImages||0)+' ảnh ('+formatBytes(bs.offlineImageBytes||0)+') • tệp mã hóa ~'+formatBytes(encodedBytes)+'.';toast('Đã sao lưu TOÀN BỘ: '+file)}catch(e){toast('Sao lưu lỗi: '+e.message)}finally{b.disabled=false;b.textContent=old}};
let selectedBackupFile=null;
function parseStoredJson(v){try{return typeof v==='string'?JSON.parse(v):v}catch(e){return null}}
function formatBytes(n){n=Number(n||0);if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';if(n<1073741824)return(n/1048576).toFixed(1)+' MB';return(n/1073741824).toFixed(2)+' GB'}
function countBackupItems(data){
 const stores=data.stores||{},heart=normalizedHeartStore(stores['kiem-tra-thu-thuat-376.html']||stores['kiem-tra-thu-thuat-375.html']||stores['kiem-tra-thu-thuat-374.html']||stores['kiem-tra-thu-thuat-373.html']||stores['kiem-tra-thu-thuat-372.html']||stores['kiem-tra-thu-thuat.html']||{}),own=stores['index.html']||{};
 const staff=parseStoredJson(heart[STAFF_V4]),rules=parseStoredJson(heart[RULES_V4]),history=parseStoredJson(own[HISTORY_KEY]);
 const bs=data.backupStats||{},drugDb=data.databases&&data.databases['drug-lookup.html'],longDb=drugDb&&Array.isArray(drugDb.databases)?drugDb.databases.find(d=>d&&d.name==='bcct_longchau_offline_v4'):null,imgDb=drugDb&&Array.isArray(drugDb.databases)?drugDb.databases.find(d=>d&&d.name==='bcct_drug_image_cache_v1'):null,productStore=longDb&&Array.isArray(longDb.stores)?longDb.stores.find(s=>s&&s.name==='products'):null,imageStore=imgDb&&Array.isArray(imgDb.stores)?imgDb.stores.find(s=>s&&s.name==='images'):null;
 return{staff:staff&&Array.isArray(staff.items)?staff.items.length:0,rules:rules&&Array.isArray(rules.items)?rules.items.length:0,history:Array.isArray(history)?history.length:0,offlineDrugs:Number(bs.offlineDrugRecords||(productStore&&productStore.records&&productStore.records.length)||0),offlineImages:Number(bs.offlineImages||(imageStore&&imageStore.records&&imageStore.records.length)||0),offlineImageBytes:Number(bs.offlineImageBytes||(drugDb&&drugDb.stats&&drugDb.stats.blobBytes)||0)};
}
function clearSelectedBackup(message){selectedBackupFile=null;const input=document.getElementById('restoreFileInput'),btn=document.getElementById('restoreBtn'),status=document.getElementById('restoreFileStatus');if(input)input.value='';btn.disabled=true;status.className='status'+(message?' err':'');status.textContent=message||'Chưa chọn tệp sao lưu trong bộ nhớ máy.'}
document.getElementById('selectRestoreFileBtn').onclick=function(){document.getElementById('restoreFileInput').click()};
document.getElementById('restoreFileInput').addEventListener('change',async function(){
 const file=this.files&&this.files[0],status=document.getElementById('restoreFileStatus'),restoreBtn=document.getElementById('restoreBtn');
 if(!file){clearSelectedBackup();return}
 status.className='status';status.textContent='Đang kiểm tra tệp '+file.name+'…';restoreBtn.disabled=true;
 try{
  const code=(await file.text()).replace(/^\uFEFF/,'').trim();if(!code)throw new Error('Tệp trống.');
  const data=await decodeBackup(code),counts=countBackupItems(data);
  selectedBackupFile={name:file.name,size:file.size||0,code,data};
  status.className='status ok';
  status.textContent='ĐÃ CHỌN: '+file.name+' • '+(data.version>=5?'FULL BACKUP V5':data.version>=4?'FULL BACKUP V4':'BACKUP CŨ')+' • '+new Date(data.createdAt).toLocaleString('vi-VN')+' • '+counts.staff+' nhân viên • '+counts.rules+' thủ thuật • '+counts.history+' lịch sử • '+counts.offlineDrugs+' thuốc offline • '+counts.offlineImages+' ảnh ('+formatBytes(counts.offlineImageBytes)+').';
  restoreBtn.disabled=false;
 }catch(e){clearSelectedBackup('Tệp không hợp lệ: '+e.message)}
});
document.getElementById('restoreBtn').onclick=async function(){
 const b=this;if(!selectedBackupFile){clearSelectedBackup('Hãy chọn tệp sao lưu trong bộ nhớ máy trước.');return}
 b.disabled=true;const old=b.textContent;b.textContent='Đang khôi phục…';
 try{
  const data=selectedBackupFile.data,code=selectedBackupFile.code,scope=document.getElementById('restoreScope').value,label=await restoreBackupData(data,scope),fileName=selectedBackupFile.name;
  localStorage.removeItem(BACKUP_KEY);localStorage.setItem(BACKUP_AT_KEY,data.createdAt);localStorage.setItem(BACKUP_FILE_KEY,'Tệp đã chọn: '+fileName);
  addHistory({tool:'Hệ thống',title:'Khôi phục từ bộ nhớ máy',summary:'Đã khôi phục '+label+' từ tệp '+fileName+', bản '+new Date(data.createdAt).toLocaleString('vi-VN')+'.'});
  toast('Đã khôi phục '+label+' từ '+fileName);setTimeout(()=>location.reload(),800)
 }catch(e){toast('Khôi phục lỗi: '+e.message);b.disabled=false;b.textContent=old}
};
